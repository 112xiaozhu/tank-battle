<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0b0f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  .touch-controls { display: none; }
  body.touch .touch-controls { display: block; }
  .touch-controls {
    position: fixed; z-index: 10;
  }
  .dpad {
    position: fixed; left: 12px; bottom: 14px;
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 4px;
  }
  .dpad .b {
    width: 56px; height: 56px;
    border: 1px solid #444; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #fff; font-size: 20px;
    touch-action: none;
  }
  .dpad .b:active { background: rgba(255,255,255,0.28); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .fire {
    position: fixed; right: 16px; bottom: 30px;
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid #f5c542; background: rgba(245,197,66,0.18);
    color: #f5c542; font-size: 18px; font-weight: bold;
    touch-action: none;
  }
  .fire:active { background: rgba(245,197,66,0.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="touch-controls">
  <div class="dpad">
    <button class="b up" data-k="ArrowUp">▲</button>
    <button class="b left" data-k="ArrowLeft">◀</button>
    <button class="b down" data-k="ArrowDown">▼</button>
    <button class="b right" data-k="ArrowRight">▶</button>
  </div>
  <button class="fire" data-k="Space">开火</button>
</div>

<script>
(function () {
  'use strict';

  // ---------- 常量 ----------
  var TILE = 36;            // 格子大小
  var COLS = 13, ROWS = 13;
  var GAME_W = COLS * TILE; // 468
  var GAME_H = ROWS * TILE; // 468
  var PANEL_W = 210;
  var W = GAME_W + PANEL_W; // 678
  var H = GAME_H;
  var TANK = 30;            // 坦克尺寸（略小于格子）
  var M = (TILE - TANK) / 2; // 边距 3
  var SCALE = 2;            // 内部 2x 渲染，保证文字清晰
  var MAX_ENEMIES = 4;
  var STEP = 1 / 60;

  // 地形类型
  var EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

  // ---------- 画布 ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  ctx.scale(SCALE, SCALE);

  // ---------- 状态 ----------
  var state = 'title'; // title | playing | paused | levelclear | gameover
  var score = 0, lives = 3, level = 1;
  var grid = [];
  var player = null;
  var enemies = [];
  var bullets = [];
  var powerups = [];
  var explosions = [];
  var enemiesToSpawn = 0;
  var spawnCooldown = 0;
  var baseAlive = true;
  var stateTimer = 0;
  var time = 0;
  var muted = false;
  var audioCtx = null;

  // ---------- 工具 ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function snap(x, y, dir) {
    if (dir === 0 || dir === 2) return [Math.round((x - M) / TILE) * TILE + M, y];
    return [x, Math.round((y - M) / TILE) * TILE + M];
  }

  function overlapsTank(x, y, self) {
    var rects = [];
    if (player && player.alive && player !== self) rects.push(player);
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.alive && e !== self) rects.push(e);
    }
    for (var j = 0; j < rects.length; j++) {
      var t = rects[j];
      if (x < t.x + t.size && x + TANK > t.x && y < t.y + t.size && y + TANK > t.y) return true;
    }
    return false;
  }

  function isFree(x, y, tank) {
    if (x < 0 || y < 0 || x + TANK > GAME_W || y + TANK > GAME_H) return false;
    var pts = [[x, y], [x + TANK - 1, y], [x, y + TANK - 1], [x + TANK - 1, y + TANK - 1]];
    for (var i = 0; i < pts.length; i++) {
      var c = Math.floor(pts[i][0] / TILE);
      var r = Math.floor(pts[i][1] / TILE);
      if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
      var t = grid[r][c];
      if (t === BRICK || t === STEEL || t === WATER || t === BASE) return false;
    }
    return !overlapsTank(x, y, tank);
  }

  function moveTank(t) {
    var nx = t.x, ny = t.y;
    if (t.dir === 0) ny -= t.speed;
    else if (t.dir === 1) nx += t.speed;
    else if (t.dir === 2) ny += t.speed;
    else nx -= t.speed;
    if (isFree(nx, ny, t)) { t.x = nx; t.y = ny; return true; }
    return false;
  }

  function drawStar(cx, cy, R, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = (i % 2 === 0) ? R : R * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // ---------- 音频 ----------
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
  }
  function sfx(name) {
    if (!audioCtx || muted) return;
    var t = audioCtx.currentTime;
    var freq = 440, dur = 0.08, type = 'square', vol = 0.12;
    if (name === 'shoot') { freq = 320; dur = 0.06; }
    else if (name === 'explode') { freq = 120; dur = 0.25; type = 'sawtooth'; vol = 0.2; }
    else if (name === 'brick') { freq = 200; dur = 0.05; }
    else if (name === 'steel') { freq = 700; dur = 0.05; type = 'triangle'; }
    else if (name === 'powerup') { freq = 880; dur = 0.15; type = 'triangle'; }
    else if (name === 'levelclear') { freq = 660; dur = 0.3; type = 'triangle'; }
    else if (name === 'gameover') { freq = 180; dur = 0.5; type = 'sawtooth'; vol = 0.18; }
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.6), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }

  // ---------- 关卡生成 ----------
  function buildLevel(n) {
    grid = [];
    for (var r = 0; r < ROWS; r++) { grid.push(new Array(COLS).fill(EMPTY)); }

    // 基地（老鹰）与砖墙保护
    grid[12][6] = BASE;
    grid[11][5] = BRICK; grid[11][6] = BRICK; grid[11][7] = BRICK;
    grid[12][5] = BRICK; grid[12][7] = BRICK;

    placeRandom(BRICK, Math.min(30 + n * 4, 55));
    placeRandom(STEEL, Math.min(5 + n * 2, 16));
    placeRandom(WATER, Math.min(4 + n, 14));
    placeRandom(TREE, Math.min(5 + n, 16));

    // 清理出生点
    grid[0][0] = EMPTY; grid[0][6] = EMPTY; grid[0][12] = EMPTY;
    grid[1][0] = EMPTY; grid[1][6] = EMPTY; grid[1][12] = EMPTY;
    // 清理玩家出生点
    grid[12][4] = EMPTY; grid[11][4] = EMPTY;
    grid[12][8] = EMPTY; grid[11][8] = EMPTY;
  }

  function placeRandom(t, count) {
    var placed = 0, guard = 0;
    while (placed < count && guard < 400) {
      guard++;
      var c = Math.floor(Math.random() * COLS);
      var r = Math.floor(Math.random() * (ROWS - 2)); // 底部两行留给基地
      if (grid[r][c] !== EMPTY) continue;
      grid[r][c] = t;
      placed++;
    }
  }

  // ---------- 敌人 ----------
  function makeEnemy() {
    var r = Math.random();
    var e = { x: 0, y: M, dir: 2, size: TANK, alive: true, type: 0, speed: 1.2, cooldown: 90, shotTimer: 0, dirTimer: 60, spawnTimer: 70, invincible: true };
    if (r < Math.max(0.1, 0.55 - level * 0.03)) { e.type = 0; e.speed = 1.2; e.cooldown = 90; }
    else if (r < 0.85) { e.type = 1; e.speed = 1.9; e.cooldown = 70; }
    else { e.type = 2; e.speed = 1.4; e.cooldown = 55; }
    e.shotTimer = 40 + Math.floor(Math.random() * 60);
    return e;
  }

  function chooseDir(e) {
    var dirs = [0, 1, 2, 3];
    if (e.type === 2 && player.alive && Math.random() < 0.65) {
      var dx = player.x - e.x, dy = player.y - e.y;
      var prefs = Math.abs(dx) > Math.abs(dy)
        ? [dx > 0 ? 1 : 3, dy > 0 ? 2 : 0]
        : [dy > 0 ? 2 : 0, dx > 0 ? 1 : 3];
      for (var i = 0; i < prefs.length; i++) {
        var s = snap(e.x, e.y, prefs[i]);
        if (isFree(s[0], s[1], e)) return prefs[i];
      }
    }
    for (var j = 0; j < 8; j++) {
      var d = dirs[Math.floor(Math.random() * 4)];
      var s2 = snap(e.x, e.y, d);
      if (isFree(s2[0], s2[1], e)) return d;
    }
    return e.dir;
  }

  function trySpawnEnemy() {
    var cols = [0, 6, 12];
    for (var i = 0; i < cols.length; i++) {
      var x = cols[i] * TILE + M, y = M;
      if (!overlapsTank(x, y, null)) {
        var e = makeEnemy();
        e.x = x; e.y = y;
        enemies.push(e);
        enemiesToSpawn--;
        return true;
      }
    }
    return false;
  }

  // ---------- 子弹 ----------
  function spawnBullet(t, owner) {
    var speed = (owner === 'player') ? (player.power >= 2 ? 7 : 5.5) : 4.5;
    var bx = t.x + TANK / 2, by = t.y + TANK / 2;
    if (t.dir === 0) by = t.y - 3;
    else if (t.dir === 1) bx = t.x + TANK + 3;
    else if (t.dir === 2) by = t.y + TANK + 3;
    else bx = t.x - 3;
    bullets.push({ x: bx, y: by, dir: t.dir, owner: owner, speed: speed, alive: true });
    sfx('shoot');
  }

  function bulletHitTank(b) {
    function inside(t) { return b.x >= t.x && b.x <= t.x + t.size && b.y >= t.y && b.y <= t.y + t.size; }
    if (b.owner === 'player') {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (e.alive && !e.invincible && inside(e)) { destroyEnemy(e); return true; }
      }
    } else {
      if (player.alive && !player.invincible && inside(player)) { destroyPlayer(); return true; }
    }
    return false;
  }

  function updateBullets() {
    var dx, dy;
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      if (!b.alive) continue;
      dx = (b.dir === 0 ? 0 : b.dir === 1 ? 1 : b.dir === 2 ? 0 : -1);
      dy = (b.dir === 0 ? -1 : b.dir === 1 ? 0 : b.dir === 2 ? 1 : 0);
      var steps = 4;
      for (var s = 0; s < steps && b.alive; s++) {
        b.x += dx * b.speed / steps;
        b.y += dy * b.speed / steps;
        if (bulletHitTile(b)) { b.alive = false; break; }
        if (b.alive && bulletHitTank(b)) { b.alive = false; break; }
      }
    }
    // 子弹对撞
    for (var a = 0; a < bullets.length; a++) {
      for (var c = a + 1; c < bullets.length; c++) {
        var x = bullets[a], y = bullets[c];
        if (x.alive && y.alive && x.owner !== y.owner && Math.abs(x.x - y.x) < 6 && Math.abs(x.y - y.y) < 6) {
          x.alive = false; y.alive = false;
        }
      }
    }
    bullets = bullets.filter(function (b) { return b.alive; });
  }

  function bulletHitTile(b) {
    var c = Math.floor(b.x / TILE), r = Math.floor(b.y / TILE);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
    var t = grid[r][c];
    if (t === BRICK) { grid[r][c] = EMPTY; maybeDropPowerup(c, r); sfx('brick'); return true; }
    if (t === STEEL) { sfx('steel'); return true; }
    if (t === BASE) {
      if (b.owner === 'enemy' && baseAlive) {
        baseAlive = false;
        spawnExplosion(c * TILE + TILE / 2, r * TILE + TILE / 2);
        sfx('explode');
      }
      return true;
    }
    return false;
  }

  // ---------- 事件处理 ----------
  function destroyEnemy(e) {
    e.alive = false;
    score += (e.type === 0 ? 100 : e.type === 1 ? 200 : 300);
    spawnExplosion(e.x + TANK / 2, e.y + TANK / 2);
    maybeDropPowerup(e);
    sfx('explode');
  }

  function destroyPlayer() {
    spawnExplosion(player.x + TANK / 2, player.y + TANK / 2);
    sfx('explode');
    lives--;
    player.alive = false;
    player.respawnTimer = 80;
    if (lives <= 0) gameOver();
  }

  function respawnPlayer() {
    player.x = 4 * TILE + M; player.y = 12 * TILE + M; player.dir = 0;
    player.alive = true; player.respawnTimer = 0; player.invincible = 150;
  }

  function spawnExplosion(x, y) {
    explosions.push({ x: x, y: y, life: 16 });
  }

  // ---------- 道具 ----------
  function maybeDropPowerup(e) {
    if (Math.random() > 0.18) return;
    var r = Math.random(), type;
    if (r < 0.35) type = 0;
    else if (r < 0.6) type = 1;
    else if (r < 0.82) type = 3;
    else type = 2;
    var c = Math.round((e.x - M) / TILE), rr2 = Math.round((e.y - M) / TILE);
    if (c >= 0 && c < COLS && rr2 >= 0 && rr2 < ROWS && grid[rr2][c] === EMPTY) {
      powerups.push({ x: c * TILE + TILE / 2, y: rr2 * TILE + TILE / 2, type: type, life: 600 });
    }
  }

  function applyPowerup(type) {
    sfx('powerup');
    if (type === 0) { player.power = Math.min(2, player.power + 1); }
    else if (type === 1) { player.invincible = 8 * 60; }
    else if (type === 2) { lives = Math.min(9, lives + 1); }
    else if (type === 3) {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (e.alive && e.spawnTimer <= 0) destroyEnemy(e);
      }
    }
  }

  // ---------- 更新 ----------
  function updateSpawning() {
    if (spawnCooldown > 0) { spawnCooldown--; return; }
    if (enemiesToSpawn > 0 && enemies.length < MAX_ENEMIES) {
      if (trySpawnEnemy()) spawnCooldown = 24;
    }
  }

  function updatePlayer() {
    if (!player.alive) {
      if (player.respawnTimer > 0) { player.respawnTimer--; return; }
      if (overlapsTank(4 * TILE + M, 12 * TILE + M, player)) { player.respawnTimer = 30; return; }
      respawnPlayer();
      return;
    }
    if (player.invincible > 0) player.invincible--;
    if (player.shotCooldown > 0) player.shotCooldown--;

    var dir = -1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) dir = 0;
    else if (keys.has('ArrowRight') || keys.has('KeyD')) dir = 1;
    else if (keys.has('ArrowDown') || keys.has('KeyS')) dir = 2;
    else if (keys.has('ArrowLeft') || keys.has('KeyA')) dir = 3;

    if (dir >= 0) {
      if (dir !== player.dir) {
        var s = snap(player.x, player.y, dir);
        if (isFree(s[0], s[1], player)) {
          player.x = s[0]; player.y = s[1]; player.dir = dir;
          moveTank(player);
        }
      } else {
        moveTank(player);
      }
    }
    if (keys.has('Space') || keys.has('KeyJ')) tryShoot(player);
  }

  function tryShoot(t) {
    if (t.shotCooldown > 0) return;
    var maxB = player.power >= 1 ? 2 : 1;
    var n = 0;
    for (var i = 0; i < bullets.length; i++) if (bullets[i].owner === 'player') n++;
    if (n >= maxB) return;
    spawnBullet(t, 'player');
    t.shotCooldown = 16;
  }

  function updateEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive) continue;
      if (e.spawnTimer > 0) { e.spawnTimer--; continue; }
      e.invincible = false;
      e.dirTimer--; e.shotTimer--;
      var moved = moveTank(e);
      if (!moved || e.dirTimer <= 0) {
        e.dir = chooseDir(e);
        e.dirTimer = 40 + Math.floor(Math.random() * 80);
      }
      if (e.shotTimer <= 0) {
        spawnBullet(e, 'enemy');
        e.shotTimer = e.cooldown + Math.floor(Math.random() * 70);
      }
    }
  }

  function updatePowerups() {
    for (var i = 0; i < powerups.length; i++) powerups[i].life--;
    powerups = powerups.filter(function (p) { return p.life > 0; });
    if (player.alive) {
      for (var j = 0; j < powerups.length; j++) {
        var p = powerups[j];
        var tx = p.x - TILE / 2, ty = p.y - TILE / 2;
        if (player.x < tx + TILE && player.x + TANK > tx && player.y < ty + TILE && player.y + TANK > ty) {
          applyPowerup(p.type);
          p.life = 0;
        }
      }
    }
  }

  function updateExplosions() {
    for (var i = 0; i < explosions.length; i++) explosions[i].life--;
    explosions = explosions.filter(function (e) { return e.life > 0; });
  }

  function update() {
    time++;
    if (state === 'playing') {
      updateSpawning();
      updatePlayer();
      updateEnemies();
      updateBullets();
      updatePowerups();
      updateExplosions();
      enemies = enemies.filter(function (e) { return e.alive; });
      if (!baseAlive) { gameOver(); return; }
      if (enemiesToSpawn <= 0 && enemies.length === 0) levelClear();
    } else if (state === 'levelclear') {
      updateExplosions();
      if (stateTimer > 0) { stateTimer--; if (stateTimer <= 0) nextLevel(); }
    } else if (state === 'gameover') {
      updateExplosions();
    }
  }

  // ---------- 游戏流程 ----------
  function initLevel() {
    buildLevel(level);
    bullets = []; powerups = []; explosions = []; enemies = [];
    enemiesToSpawn = Math.min(15 + level * 2, 30);
    spawnCooldown = 20;
    baseAlive = true;
    player = { x: 4 * TILE + M, y: 12 * TILE + M, dir: 0, speed: 2.2, alive: true, respawnTimer: 0, invincible: 120, shotCooldown: 0, power: 0 };
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    initLevel();
    state = 'playing';
    initAudio();
  }

  function nextLevel() {
    level++;
    initLevel();
    state = 'playing';
  }

  function levelClear() {
    state = 'levelclear';
    stateTimer = 150;
    score += 500;
    sfx('levelclear');
  }

  function gameOver() {
    state = 'gameover';
    sfx('gameover');
  }

  // ---------- 渲染 ----------
  function drawTank(x, y, dir, body, accent) {
    var s = TANK, cx = x + s / 2, cy = y + s / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(dir * Math.PI / 2);
    ctx.fillStyle = '#26262c';
    ctx.fillRect(-s / 2, -s / 2, s * 0.24, s);
    ctx.fillRect(s / 2 - s * 0.24, -s / 2, s * 0.24, s);
    ctx.fillStyle = body;
    rr(-s * 0.38, -s * 0.38, s * 0.76, s * 0.76, 4); ctx.fill();
    ctx.fillStyle = accent;
    ctx.fillRect(-s * 0.07, -s * 0.6, s * 0.14, s * 0.42);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawMiniTank(x, y, dir, color) {
    var s = 14;
    ctx.save();
    ctx.translate(x + s / 2, y + s / 2);
    ctx.rotate(dir * Math.PI / 2);
    ctx.fillStyle = '#333';
    ctx.fillRect(-s / 2, -s / 2, s * 0.2, s);
    ctx.fillRect(s / 2 - s * 0.2, -s / 2, s * 0.2, s);
    ctx.fillStyle = color;
    rr(-s * 0.34, -s * 0.34, s * 0.68, s * 0.68, 2); ctx.fill();
    ctx.fillRect(-s * 0.06, -s * 0.55, s * 0.12, s * 0.35);
    ctx.restore();
  }

  function drawTile(c, r, t) {
    var x = c * TILE, y = r * TILE;
    if (t === BRICK) {
      ctx.fillStyle = '#c15a3a'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#8a3a22';
      var bh = TILE / 2;
      ctx.fillRect(x, y + bh - 1, TILE, 2);
      ctx.fillRect(x + TILE / 2 - 1, y, 2, bh);
      ctx.fillRect(x, y + bh + 1, TILE, 1);
    } else if (t === STEEL) {
      ctx.fillStyle = '#a9b7c0'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#cddae2'; ctx.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = '#7b8a94';
      ctx.fillRect(x + TILE / 2 - 1, y, 2, TILE);
    } else if (t === WATER) {
      ctx.fillStyle = '#3a74ad'; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#7fb7e8';
      for (var i = 0; i < 2; i++) {
        var yy = y + 8 + i * 18;
        var off = Math.sin(time * 0.06 + c + i) * 3;
        ctx.fillRect(x + 3, yy + off, TILE - 6, 3);
      }
    }
  }

  function drawTree(c, r) {
    var x = c * TILE + TILE / 2, y = r * TILE + TILE / 2;
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#2f7d33';
    ctx.beginPath(); ctx.arc(x, y, TILE * 0.44, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3f9b46';
    ctx.beginPath(); ctx.arc(x - 2, y - 2, TILE * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawBase(x, y) {
    if (baseAlive) {
      var s = TILE, cx = x + s / 2, cy = y + s / 2;
      ctx.save(); ctx.translate(cx, cy);
      ctx.fillStyle = '#6b4a20';
      rr(-s * 0.42, -s * 0.42, s * 0.84, s * 0.84, 4); ctx.fill();
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.moveTo(-s * 0.34, s * 0.28); ctx.lineTo(0, -s * 0.18); ctx.lineTo(-s * 0.08, s * 0.3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(s * 0.34, s * 0.28); ctx.lineTo(0, -s * 0.18); ctx.lineTo(s * 0.08, s * 0.3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -s * 0.22, s * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d89a1f';
      ctx.beginPath(); ctx.moveTo(0, -s * 0.12); ctx.lineTo(s * 0.05, -s * 0.22); ctx.lineTo(-s * 0.05, -s * 0.22); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#3a3a3a'; ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
      ctx.fillStyle = '#222'; ctx.fillRect(x + 8, y + 8, TILE - 16, TILE - 16);
    }
  }

  function drawSpawnStar(cx, cy) {
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, TANK * 0.5, 0, Math.PI * 2); ctx.stroke();
    drawStar(cx, cy, TANK * 0.34, '#f5c542');
  }

  function drawPowerups() {
    for (var i = 0; i < powerups.length; i++) {
      var p = powerups[i];
      if (Math.floor(p.life / 8) % 2 === 0) continue;
      var s = TILE * 0.7;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      rr(p.x - s / 2 - 2, p.y - s / 2 - 2, s + 4, s + 4, 6); ctx.fill();
      if (p.type === 0) drawStar(p.x, p.y, s * 0.45, '#ffd23f');
      else if (p.type === 1) { ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.4, 0, Math.PI * 2); ctx.fill(); }
      else if (p.type === 2) drawMiniTank(p.x - 9, p.y - 8, 0, '#6fe06f');
      else { ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.38, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ff6b6b'; ctx.fillRect(p.x - s * 0.08, p.y - s * 0.55, s * 0.16, s * 0.25); }
    }
  }

  function drawBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.fillStyle = (b.owner === 'player') ? '#ffffff' : '#ff6b6b';
      ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    }
  }

  function drawExplosions() {
    for (var i = 0; i < explosions.length; i++) {
      var e = explosions[i];
      var prog = 1 - e.life / 16;
      var R = prog * TANK * 1.1;
      ctx.globalAlpha = e.life / 16;
      ctx.fillStyle = prog < 0.4 ? '#fff' : prog < 0.7 ? '#ffd23f' : '#ff6b3a';
      ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawPanel() {
    var px = GAME_W;
    ctx.fillStyle = '#232330';
    ctx.fillRect(px, 0, PANEL_W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#f5c542';
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.fillText('坦克大战', px + PANEL_W / 2, 40);

    ctx.fillStyle = '#8a8a9a';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('得分', px + PANEL_W / 2, 70);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.fillText(String(score), px + PANEL_W / 2, 94);

    ctx.fillStyle = '#8a8a9a';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('第 ' + level + ' 关', px + PANEL_W / 2, 122);

    ctx.fillStyle = '#8a8a9a';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('生命', px + 40, 152);
    for (var i = 0; i < Math.max(0, lives); i++) {
      drawMiniTank(px + 72 + i * 26, 142, 0, '#f5c542');
    }

    ctx.fillStyle = '#8a8a9a';
    ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
    ctx.fillText('剩余敌人', px + 40, 194);
    var rem = enemiesToSpawn + enemies.length;
    for (var j = 0; j < rem && j < 24; j++) {
      var col = j % 3, row = Math.floor(j / 3);
      drawMiniTank(px + 74 + col * 22, 182 + row * 19, 2, '#c9cdd3');
    }

    ctx.fillStyle = '#8a8a9a';
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.fillText('移动：方向键 / WASD', px + PANEL_W / 2, H - 84);
    ctx.fillText('射击：空格 / J', px + PANEL_W / 2, H - 66);
    ctx.fillText('暂停：P    静音：M', px + PANEL_W / 2, H - 48);
    ctx.fillText('开始 / 继续：Enter', px + PANEL_W / 2, H - 30);
  }

  function drawOverlay() {
    if (state === 'playing') return;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (state === 'title') {
      ctx.fillStyle = '#f5c542';
      ctx.font = 'bold 46px "Microsoft YaHei", sans-serif';
      ctx.fillText('坦克大战', W / 2, H / 2 - 90);
      ctx.fillStyle = '#e8e8f0';
      ctx.font = '18px "Microsoft YaHei", sans-serif';
      ctx.fillText('保护基地，消灭所有敌人坦克', W / 2, H / 2 - 40);
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Microsoft YaHei", sans-serif';
      ctx.fillText('方向键 / WASD 移动    空格 / J 射击', W / 2, H / 2 + 10);
      ctx.fillText('P 暂停    M 静音', W / 2, H / 2 + 38);
      if (Math.floor(time / 30) % 2 === 0) {
        ctx.fillStyle = '#f5c542';
        ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
        ctx.fillText('按 Enter 开始', W / 2, H / 2 + 90);
      }
    } else if (state === 'paused') {
      ctx.fillStyle = '#f5c542';
      ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
      ctx.fillText('已暂停', W / 2, H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '16px "Microsoft YaHei", sans-serif';
      ctx.fillText('按 P 或 Enter 继续', W / 2, H / 2 + 30);
    } else if (state === 'gameover') {
      ctx.fillStyle = '#ff5b5b';
      ctx.font = 'bold 44px "Microsoft YaHei", sans-serif';
      ctx.fillText('游戏结束', W / 2, H / 2 - 60);
      ctx.fillStyle = '#fff';
      ctx.font = '20px "Microsoft YaHei", sans-serif';
      ctx.fillText('最终得分：' + score, W / 2, H / 2 - 15);
      if (Math.floor(time / 30) % 2 === 0) {
        ctx.fillStyle = '#f5c542';
        ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
        ctx.fillText('按 Enter 重新开始', W / 2, H / 2 + 40);
      }
    } else if (state === 'levelclear') {
      ctx.fillStyle = '#5bff8a';
      ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
      ctx.fillText('第 ' + level + ' 关通过！', W / 2, H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '18px "Microsoft YaHei", sans-serif';
      ctx.fillText('奖励 500 分', W / 2, H / 2 + 25);
      ctx.fillText('即将进入下一关…', W / 2, H / 2 + 55);
    }
    ctx.textBaseline = 'alphabetic';
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var t = grid[r][c];
        if (t === BRICK || t === STEEL || t === WATER) drawTile(c, r, t);
        else if (t === BASE) drawBase(c * TILE, r * TILE);
      }
    }

    drawPowerups();

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive) continue;
      if (e.spawnTimer > 0) {
        if (Math.floor(time / 6) % 2 === 0) drawSpawnStar(e.x + TANK / 2, e.y + TANK / 2);
      } else {
        var colors = ['#c9cdd3', '#7fd0ff', '#ff8a6b'];
        drawTank(e.x, e.y, e.dir, colors[e.type], '#eef3f7');
      }
    }

    if (player.alive) {
      drawTank(player.x, player.y, player.dir, '#f5c542', '#fff2b0');
      if (player.invincible > 0) {
        ctx.strokeStyle = 'rgba(120,220,255,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + TANK / 2, player.y + TANK / 2, TANK * 0.72, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 树木最后绘制，遮挡坦克
    for (var r2 = 0; r2 < ROWS; r2++) {
      for (var c2 = 0; c2 < COLS; c2++) {
        if (grid[r2][c2] === TREE) drawTree(c2, r2);
      }
    }

    drawBullets();
    drawExplosions();
    drawPanel();
    drawOverlay();
  }

  // ---------- 输入 ----------
  var keys = new Set();
  function onKeyDown(e) {
    var code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(code) >= 0) e.preventDefault();
    keys.add(code);
    if (code === 'Enter') {
      if (state === 'title' || state === 'gameover') startGame();
      else if (state === 'levelclear') nextLevel();
      else if (state === 'paused') state = 'playing';
    }
    if (code === 'KeyP') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
    if (code === 'KeyM') muted = !muted;
  }
  function onKeyUp(e) { keys.delete(e.code); }

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  canvas.addEventListener('click', function () {
    if (state === 'title' || state === 'gameover') startGame();
    else if (state === 'levelclear') nextLevel();
  });

  // 触屏控件
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.body.classList.add('touch');
  }
  var btns = document.querySelectorAll('.touch-controls button');
  for (var bi = 0; bi < btns.length; bi++) {
    (function (btn) {
      var k = btn.getAttribute('data-k');
      var on = function (e) { e.preventDefault(); keys.add(k); };
      var off = function (e) { e.preventDefault(); keys.delete(k); };
      btn.addEventListener('pointerdown', on);
      btn.addEventListener('pointerup', off);
      btn.addEventListener('pointerleave', off);
      btn.addEventListener('pointercancel', off);
    })(btns[bi]);
  }

  // ---------- 自适应 ----------
  function resize() {
    var availW = Math.min(window.innerWidth, 1200);
    var availH = window.innerHeight;
    var s = Math.min(availW / W, availH / H, 2.2);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 主循环 ----------
  initLevel();
  var last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    acc += (now - last) / 1000;
    last = now;
    if (acc > 0.25) acc = 0.25;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
